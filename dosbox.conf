; ============================================================
; Config de DOSBox para Arena Web (fuente única de verdad)
; Este archivo va embebido en el bundle .jsdos por build_bundle.py.
; Editalo acá, no dentro de bundle/.
; ============================================================

[dosbox]
machine=svga_s3
memsize=32

[render]
frameskip=1
aspect=false
scaler=none

[cpu]
core=auto
cyclerate=normal
cycles=fixed 30000

[mixer]
nosound=false
rate=44100
blocksize=1024
prebuffer=20

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
sbmixer=true
oplmode=auto
oplemu=default
oplrate=44100

[gus]
gus=false

[speaker]
pcspeaker=true
pcrate=44100
tandy=off

[midi]
mpu401=auto
mididevice=default

[joystick]
joysticktype=none

[dos]
xms=true
ems=true
umb=true

[autoexec]
@echo off
mount c .
mount d . -t cdrom
c:
set ARENADATA=C:
d:
ACD -Ssbpdig.adv -IOS220 -IRQS7 -DMAS1 -Mgenmidi.adv -IOM330 -IRQM2 -DMAM1
exit
