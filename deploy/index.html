<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Elder Scrolls: Arena (1994) — WebAssembly</title>
  <style>
    html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
    #root { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
    #dosbox { width: 100%; height: 100%; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #000;
      color: #c8a24b; font-family: monospace; z-index: 10; transition: opacity .5s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading .title { font-size: 22px; letter-spacing: 2px; margin-bottom: 18px; }
    #loading .bar { width: 260px; height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
    #loading .bar > div { height: 100%; width: 0%; background: #c8a24b; transition: width .3s; }
    #loading .msg { margin-top: 12px; font-size: 12px; color: #777; }
    #loading.error .title { color: #d9534f; }
    #loading .credit { margin-top: 22px; font-size: 11px; color: #555; }
    #loading .credit a { color: #555; text-decoration: none; }
    #loading .credit a:hover { color: #c8a24b; }
    .tip { position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
           color: #555; font: 11px monospace; pointer-events: none; z-index: 5; }
  </style>
  <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
  <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
</head>
<body>
  <div id="root">
    <div id="dosbox"></div>
  </div>
  <div id="loading">
    <div class="title">THE ELDER SCROLLS: ARENA</div>
    <div class="bar"><div id="bar"></div></div>
    <div class="msg" id="msg">Cargando emulador…</div>
    <div class="credit">Porteado por Franco Castillo (<a href="https://github.com/FrancoCastillo1" target="_blank" rel="noopener">FrancoCastillo1</a> en GitHub)</div>
  </div>
  <div class="tip">Protección anticopia: al salir de la dungeon inicial teclea una palabra de Passwords.txt · Menú js-dos: Esc</div>
  <script>
    const loading = document.getElementById("loading");
    const bar = document.getElementById("bar");
    const msg = document.getElementById("msg");

    function setProgress(pct, text) {
      bar.style.width = pct + "%";
      if (text) msg.textContent = text;
    }
    function fail(text) {
      loading.classList.add("error");
      msg.textContent = text;
      bar.style.background = "#d9534f";
    }

    // Precarga del bundle para mostrar progreso
    fetch("./arena-v4.jsdos").then(async (res) => {
      if (!res.ok) throw new Error("HTTP " + res.status);
      const total = +res.headers.get("Content-Length") || 0;
      const reader = res.body.getReader();
      let received = 0;
      const chunks = [];
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
        if (total) setProgress(Math.round(received / total * 60), "Descargando juego… " + Math.round(received / total * 100) + "%");
      }
      const blob = new Blob(chunks);
      const url = URL.createObjectURL(blob);
      setProgress(70, "Iniciando DOSBox…");
      boot(url);
    }).catch((e) => fail("Error descargando el juego: " + e.message));

    function boot(bundleUrl) {
      const props = Dos(document.getElementById("dosbox"), {
        url: bundleUrl,
        autoStart: true,
        imageRendering: "pixelated",
        offscreenCanvas: true,
        onEvent: (event) => {
          if (event === "ci-ready") {
            setProgress(100, "¡Listo!");
            setTimeout(() => loading.classList.add("hidden"), 400);
          }
        },
      });
      props.setNoCloud(true);
    }
  </script>
</body>
</html>
